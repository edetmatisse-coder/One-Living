# Mise en ligne sur GitHub Pages : à chaque push, le site est construit
# dans le sous-dossier /One-Living/ puis publié.
# Adresse : https://edetmatisse-coder.github.io/One-Living/
name: Mise en ligne (GitHub Pages)

on:
  push:
    branches: [claude/loving-goodall-iiro2p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire le site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /One-Living
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
